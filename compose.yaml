networks:
  proxy:
    name: proxy
    external: true

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2.15.0
    container_name: arcane
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./arcane-data:/app/data
      - ./projects:/app/data/projects
      - arcane-backups:/backups
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.arcane-grpc.rule=Host(`${ARCANE_HOST:-dockermgr.chetan.local}`) && Path(`/api/tunnel/connect`) && Method(`POST`) && HeaderRegexp(`Content-Type`, `^application/grpc`)'
      - traefik.http.routers.arcane-grpc.priority=100
      - traefik.http.routers.arcane-grpc.service=arcane-grpc
      - traefik.http.services.arcane-grpc.loadbalancer.server.port=3552
      - traefik.http.services.arcane-grpc.loadbalancer.server.scheme=h2c
      - 'traefik.http.routers.arcane-web.rule=Host(`${ARCANE_HOST:-dockermgr.chetan.local}`)'
      - traefik.http.routers.arcane-web.priority=10
      - traefik.http.routers.arcane-web.service=arcane-web
      - traefik.http.services.arcane-web.loadbalancer.server.port=3552
      - traefik.http.services.arcane-web.loadbalancer.server.scheme=http
    networks:
      - proxy
    cgroup: host
    restart: unless-stopped
    healthcheck:
      test: ['CMD', './arcane', 'health', '--timeout', '2s']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-5}"


  traefik:
    image: traefik:v3.7.13
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - 'traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST:-proxy.chetan.local}`)'
      - traefik.http.routers.traefik-dashboard.service=api@internal
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    depends_on:
      arcane:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILE:-5}"


volumes:
  arcane-backups:
    name: arcane-backups
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/arcane-backups

