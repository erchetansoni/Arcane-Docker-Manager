global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true

accessLog:
  format: json
  bufferingSize: 100
  filters:
    retryAttempts: true
    minDuration: "10ms"

metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

tracing:
  serviceName: traefik
  sampleRate: 1.0
  otlp:
    http:
      endpoint: "http://otel-collector:4318/v1/traces"

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}
  # For Zabbix Proxy TCP Port
  zabbix:
    address: ":10051" 

providers:
  docker:
    exposedByDefault: false
    network: proxy
  file:
    directory: /etc/traefik/dynamic
    watch: true

